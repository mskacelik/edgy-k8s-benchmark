# ============================================================================
# DO NOT CHANGE resources OR nodeSelector WITHOUT RE-RUNNING EVERY CELL.
# Both are matched variables under PLAN-CH7.md §4.4 and §6.1. A mid-campaign
# change makes earlier cells incomparable to later ones, silently. See
# docs/RUN-PLAN.md §2 for the incident this comment exists because of.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-a
spec:
  selector:
    app: backend-a
  ports:
  - name: http
    port: 8080
  - name: https
    port: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: backend-b
spec:
  selector:
    app: backend-b
  ports:
  - name: http
    port: 8080
  - name: https
    port: 8443
---
# Scenario C's direct arm: one Service over two replicas, so Kubernetes does the
# balancing and no gateway is in the path (PLAN-CH7.md §4.2). Selects on `role`
# rather than `app`, which is the only label both backends share. HTTPS only —
# the point of the arm is TLS.
apiVersion: v1
kind: Service
metadata:
  name: backend-lb
spec:
  selector:
    role: backend
  ports:
  - name: https
    port: 8443
    targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-a
  template:
    metadata:
      labels:
        app: backend-a
        role: backend
    spec:
      # Pinned. Placement was uncontrolled until 2026-11-18 and moved between
      # runs; one cell landed the backend on the database's node and its p90 went
      # from 0.9 ms to 6.7 ms. These are the nodes the clean SCG 9500 and Edgy
      # 22000 cells ran on. To move the campaign to other nodes, change all five
      # nodeSelectors here, in gateways.yaml, postgres.yaml, consul.yaml and
      # hyperfoil.yaml together, and re-run everything.
      nodeSelector:
        kubernetes.io/hostname: kub-a17.priv.cerit-sc.cz
      # The namespace enforces the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        # Tag duplicated from kustomization.yaml's `images:` block on purpose, so
        # that an accidental `kubectl apply -f` still pulls a real image instead
        # of :latest, which does not exist. Move both together.
        image: ghcr.io/mskacelik/bench-backend:ee77d00
        envFrom:
        - secretRef:
            name: db-credentials
        - configMapRef:
            name: backend-env
        ports:
        - containerPort: 8080
        - containerPort: 8443
        volumeMounts:
        - name: tls
          mountPath: /deployments/tls
          readOnly: true
        readinessProbe:
          httpGet: { path: /items/1, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 5
        # requests MUST equal limits: that is what puts the pod in Guaranteed QoS
        # and keeps CFS throttling out of the measurement (PLAN-CH7.md §6.1).
        # 3 CPU is deliberate and sufficient: at Edgy's 22000 req/s the backend
        # drew 1867m of it, 62 %, while the gateway was at 94 % — so the gateway
        # is the limiter, which is the whole point. Raising this to 6 would also
        # break the quota once both backends and a gateway are up.
        resources:
          requests: { cpu: "3", memory: 3Gi }
          limits: { cpu: "3", memory: 3Gi }
      volumes:
      - name: tls
        secret:
          secretName: backend-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-b
  template:
    metadata:
      labels:
        app: backend-b
        role: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: kub-a15.priv.cerit-sc.cz
      # The namespace enforces the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        image: ghcr.io/mskacelik/bench-backend:ee77d00
        envFrom:
        - secretRef:
            name: db-credentials
        - configMapRef:
            name: backend-env
        ports:
        - containerPort: 8080
        - containerPort: 8443
        volumeMounts:
        - name: tls
          mountPath: /deployments/tls
          readOnly: true
        readinessProbe:
          httpGet: { path: /items/1, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 5
        # Must stay identical to backend-a. Scenario C balances across the two.
        resources:
          requests: { cpu: "3", memory: 3Gi }
          limits: { cpu: "3", memory: 3Gi }
      volumes:
      - name: tls
        secret:
          secretName: backend-tls
