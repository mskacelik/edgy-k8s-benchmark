apiVersion: v1
kind: Service
metadata:
  name: backend-a
spec:
  selector:
    app: backend-a
  ports:
    - name: http
      port: 8080
    - name: https
      port: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: backend-b
spec:
  selector:
    app: backend-b
  ports:
    - name: http
      port: 8080
    - name: https
      port: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-a
  template:
    metadata:
      labels:
        app: backend-a
        role: backend
    spec:
      # The namespace enforces the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: ghcr.io/mskacelik/bench-backend
          envFrom:
            - secretRef:
                name: db-credentials
            - configMapRef:
                name: backend-env
          ports:
            - containerPort: 8080
            - containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /deployments/tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /items/1, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "3", memory: 3Gi }
            limits: { cpu: "3", memory: 3Gi }
      volumes:
        - name: tls
          secret:
            secretName: backend-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-b
  template:
    metadata:
      labels:
        app: backend-b
        role: backend
    spec:
      # The namespace enforces the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: ghcr.io/mskacelik/bench-backend
          envFrom:
            - secretRef:
                name: db-credentials
            - configMapRef:
                name: backend-env
          ports:
            - containerPort: 8080
            - containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /deployments/tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /items/1, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "3", memory: 3Gi }
            limits: { cpu: "3", memory: 3Gi }
      volumes:
        - name: tls
          secret:
            secretName: backend-tls
