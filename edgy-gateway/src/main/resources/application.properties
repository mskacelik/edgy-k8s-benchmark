quarkus.application.name=edgy-gateway

quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Quarkus enables h2c by default and Spring Boot does not. Left alone, a generator
# that negotiates HTTP/2 would measure one arm over h2c and the other over 1.1.
quarkus.http.http2=false

bench.backend.url=${BACKEND_URL:http://localhost:8081}
bench.backend.service-name=${BACKEND_SERVICE_NAME:backend-service}

# Not under test, so matched against Spring Cloud Gateway rather than left at defaults.
edgy.logging.enabled=false
edgy.metrics.enabled=false
edgy.tracing.enabled=false

edgy.origin."backend".max-pool-size=${UPSTREAM_POOL_SIZE:64}
edgy.origin."backend-transform".max-pool-size=${UPSTREAM_POOL_SIZE:64}
edgy.origin."backend-discovered".max-pool-size=${UPSTREAM_POOL_SIZE:64}

edgy.origin."backend-discovered".tls-configuration-name=upstream
quarkus.tls.upstream.trust-store.pem.certs=${TLS_CA_CERT_PATH:/deployments/tls/ca-cert.pem}

quarkus.stork."backend-service".service-discovery.type=consul
quarkus.stork."backend-service".service-discovery.consul-host=${CONSUL_HOST:localhost}
quarkus.stork."backend-service".service-discovery.consul-port=${CONSUL_PORT:8500}
quarkus.stork."backend-service".load-balancer.type=round-robin
# Matched against SCG's catalog watch: the topology is static, so neither gateway
# should be doing discovery work during a measurement window.
quarkus.stork."backend-service".service-discovery.refresh-period=${DISCOVERY_REFRESH:300s}

quarkus.vertx.event-loops-pool-size=${EVENT_LOOPS:4}

quarkus.log.level=WARN
