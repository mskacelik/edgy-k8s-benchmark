apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skacelik-ns

resources:
  - k8s/postgres.yaml
  - k8s/consul.yaml
  - k8s/backends.yaml
  - k8s/gateways.yaml
  - k8s/hyperfoil.yaml

# Change this one line when a new Edgy commit is built. It is the short SHA that
# scripts/build-images.sh and the images workflow print.
images:
  - name: ghcr.io/mskacelik/bench-backend
    newTag: ee77d00
  - name: ghcr.io/mskacelik/bench-edgy-gateway
    newTag: ee77d00
  - name: ghcr.io/mskacelik/bench-scg-gateway
    newTag: ee77d00
  - name: ghcr.io/mskacelik/bench-edgy-gateway-native
    newTag: ee77d00
  - name: ghcr.io/mskacelik/bench-scg-gateway-native
    newTag: ee77d00
configMapGenerator:
  - name: db-seed
    files:
      - seed.sql=db/seed.sql
  - name: consul-registration
    files:
      - registration.json=consul/registration.json
  - name: backend-env
    literals:
      - EVENT_LOOPS=4
      - TLS_CERT_PATH=/deployments/tls/server-cert.pem
      - TLS_KEY_PATH=/deployments/tls/server-key.pem
  # Identical for both gateways. Anything that differs here is measured as if it
  # were a difference between the gateways themselves.
  - name: gateway-env
    literals:
      - BACKEND_URL=http://backend-a:8080
      - BACKEND_SERVICE_NAME=backend-service
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - UPSTREAM_POOL_SIZE=64
      - EVENT_LOOPS=4
      - DISCOVERY_REFRESH=300s
      - DISCOVERY_REFRESH_MS=300000
      - TLS_CA_CERT_PATH=/deployments/tls/ca-cert.pem

secretGenerator:
  - name: db-credentials
    literals:
      - POSTGRES_DB=bench
      - POSTGRES_USER=bench
      - POSTGRES_PASSWORD=bench
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=bench
      - DB_USER=bench
      - DB_PASSWORD=bench
  - name: backend-tls
    files:
      - tls/server-cert.pem
      - tls/server-key.pem
  - name: gateway-tls
    files:
      - tls/ca-cert.pem

generatorOptions:
  disableNameSuffixHash: true
