# Smoke testing only. Generator and system under test share one kernel here, so
# nothing measured in this file is a benchmark result.

x-backend: &backend
  build:
    context: .
    dockerfile: backend-service/src/main/docker/Dockerfile.jvm
  environment: &backend-env
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: bench
    DB_USER: bench
    DB_PASSWORD: bench
    TLS_CERT_PATH: /deployments/tls/server-cert.pem
    TLS_KEY_PATH: /deployments/tls/server-key.pem
    EVENT_LOOPS: "4"
  volumes:
    - ./tls:/deployments/tls:ro
  depends_on:
    postgres:
      condition: service_healthy
  networks: [bench]

# Identical on both gateways: anything that differs here is measured as if it were
# a difference between the gateways themselves.
x-gateway-env: &gateway-env
  BACKEND_URL: http://backend-a:8080
  BACKEND_SERVICE_NAME: backend-service
  CONSUL_HOST: consul
  CONSUL_PORT: "8500"
  UPSTREAM_POOL_SIZE: "64"
  EVENT_LOOPS: "4"
  TLS_CA_CERT_PATH: /deployments/tls/ca-cert.pem

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # pg_isready passes while the init scripts are still running, and seeding a
      # million rows takes a while; wait for the data, not just the socket.
      test: ["CMD-SHELL", "psql -U bench -d bench -tAc 'SELECT 1 FROM item LIMIT 1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bench]

  backend-a:
    <<: *backend
    ports:
      - "8081:8080"
      - "8444:8443"

  backend-b:
    <<: *backend
    ports:
      - "8082:8080"
      - "8445:8443"

  consul:
    image: hashicorp/consul:1.22
    command: consul agent -dev -config-dir=/consul/config -client=0.0.0.0 -log-level=warn
    volumes:
      # Not read-only: the Consul entrypoint chowns its config directory.
      - ./consul:/consul/config
    ports:
      - "8500:8500"
    networks: [bench]

  edgy-gateway:
    build:
      context: .
      dockerfile: edgy-gateway/src/main/docker/Dockerfile.jvm
      additional_contexts:
        m2repo: ~/.m2/repository/org/acme
    environment:
      <<: *gateway-env
    ports:
      - "8083:8080"
    volumes:
      - ./tls:/deployments/tls:ro
    depends_on: [backend-a, backend-b, consul]
    networks: [bench]

  scg-gateway:
    build:
      context: .
      dockerfile: scg-gateway/src/main/docker/Dockerfile
    environment:
      <<: *gateway-env
    ports:
      - "8084:8080"
    volumes:
      - ./tls:/deployments/tls:ro
    depends_on: [backend-a, backend-b, consul]
    networks: [bench]

networks:
  bench:
