quarkus.application.name=backend-service

quarkus.http.port=8080
quarkus.http.ssl-port=8443
quarkus.http.host=0.0.0.0

# Prod only: the bucket is built eagerly, so declaring it unprofiled would make
# tests demand certificate files that only exist in a container.
%prod.quarkus.tls.https.key-store.pem.main.cert=${TLS_CERT_PATH:/deployments/tls/server-cert.pem}
%prod.quarkus.tls.https.key-store.pem.main.key=${TLS_KEY_PATH:/deployments/tls/server-key.pem}
%prod.quarkus.http.tls-configuration-name=https

quarkus.datasource.db-kind=postgresql

# Prod only: an explicit URL suppresses Dev Services, which the tests rely on.
%prod.quarkus.datasource.username=${DB_USER:bench}
%prod.quarkus.datasource.password=${DB_PASSWORD:bench}
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bench}

# db/seed.sql owns the schema; two instances must not race to reconcile it.
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.vertx.event-loops-pool-size=${EVENT_LOOPS:4}

quarkus.log.level=WARN

%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import-test.sql
