name: images

# Runs on amd64, which is what the cluster is. Native images are machine code and
# cannot be cross-built cheaply, so this is the only practical way to produce one
# from an Apple-silicon workstation.

on:
  workflow_dispatch:
    inputs:
      edgy_ref:
        description: Edgy commit, tag or branch to build against
        default: main
      native:
        description: Also build the native Edgy gateway
        type: boolean
        default: true
      push:
        description: Push to ghcr.io
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: mskacelik/edgy
          ref: ${{ inputs.edgy_ref }}
          path: .edgy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve the Edgy revision
        id: edgy
        working-directory: .edgy
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Edgy is not published to any remote Maven repository, so the images can
      # only be built against a checkout that this job installs itself.
      - name: Install Edgy
        working-directory: .edgy
        run: ./mvnw -B -q install -DskipTests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ steps.edgy.outputs.tag }}
          SHA: ${{ steps.edgy.outputs.sha }}
        run: |
          set -euo pipefail
          BASE="$REGISTRY/bench-base:$TAG"
          # buildx takes one output: --push or --load, never both.
          OUTPUT="--load"
          [[ "${{ inputs.push }}" == "true" ]] && OUTPUT="--push"

          build() {
            docker buildx build --platform linux/amd64 \
              --label "org.opencontainers.image.revision=$SHA" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              $OUTPUT "$@" .
          }

          build -t "$BASE" -f base/Dockerfile base
          build -t "$REGISTRY/bench-backend:$TAG" \
            -f backend-service/src/main/docker/Dockerfile.jvm \
            --build-arg "BASE_IMAGE=$BASE"
          build -t "$REGISTRY/bench-edgy-gateway:$TAG" \
            -f edgy-gateway/src/main/docker/Dockerfile.jvm \
            --build-arg "BASE_IMAGE=$BASE" \
            --build-context "m2repo=$HOME/.m2/repository/org/acme"
          build -t "$REGISTRY/bench-scg-gateway:$TAG" \
            -f scg-gateway/src/main/docker/Dockerfile \
            --build-arg "BASE_IMAGE=$BASE"

          if [[ "${{ inputs.native }}" == "true" ]]; then
            build -t "$REGISTRY/bench-edgy-gateway-native:$TAG" \
              -f edgy-gateway/src/main/docker/Dockerfile.native \
              --build-context "m2repo=$HOME/.m2/repository/org/acme"
          fi

          echo "### Images built at tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Edgy revision \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
