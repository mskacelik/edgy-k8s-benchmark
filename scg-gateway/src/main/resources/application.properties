spring.application.name=scg-gateway
server.port=8080

bench.backend.url=${BACKEND_URL:http://localhost:8081}
bench.backend.service-name=${BACKEND_SERVICE_NAME:backend-service}

# Not under test, so matched against Edgy rather than left at defaults. metrics.enabled
# is already false by default; observability.enabled is not, and instruments every request.
spring.cloud.gateway.server.webflux.metrics.enabled=false
spring.cloud.gateway.server.webflux.observability.enabled=false

spring.cloud.gateway.server.webflux.httpclient.pool.type=FIXED
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=${UPSTREAM_POOL_SIZE:64}
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=${UPSTREAM_ACQUIRE_TIMEOUT_MS:45000}

# The same PEM Edgy trusts, so both gateways share one trust anchor in one format.
spring.cloud.gateway.server.webflux.httpclient.ssl.trusted-x509-certificates=${TLS_CA_CERT_PATH:/deployments/tls/ca-cert.pem}

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=false
spring.cloud.consul.discovery.use-agent-address=false
# Matched against Stork's refresh-period; the default watch delay is 1s, which is
# discovery work in the gateway process on one side only.
spring.cloud.consul.discovery.catalog-services-watch-delay=${DISCOVERY_REFRESH_MS:300000}

spring.cloud.loadbalancer.configurations=default
spring.cloud.loadbalancer.cache.ttl=${DISCOVERY_REFRESH:300s}

logging.level.root=WARN
