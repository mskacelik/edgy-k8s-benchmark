name: scenario-a
# Scenario A, pass-through GET. Copy this file per arm and change `host` only.
#   direct : http://backend-a:8080  with path /items/$id
#   edgy   : http://edgy-gateway:8080
#   scg    : http://scg-gateway:8080

agents:
  # Each agent is a pod the controller creates and deletes per run. The namespace
  # LimitRange gives it 1 CPU and 512Mi, which cannot be set from here — add more
  # agents rather than bigger ones. Set `node:` once you know a node name, to keep
  # the generator off the gateway's node.
  agent-one:
  agent-two:

http:
  host: http://edgy-gateway:8080
  sharedConnections: 100

# Open model: requests go out on a schedule regardless of whether earlier ones
# have come back. A closed model would hide latency behind a stalled service.
phases:
  - warmup:
      constantRate:
        usersPerSec: 1000
        duration: 2m
        maxSessions: 20000
        scenario: &scenario
          - read:
              - randomInt: id <- 1 .. 1000000
              - httpRequest:
                  GET: /api/items/${id}
                  sla:
                    - meanResponseTime: 100ms
  - steady:
      constantRate:
        usersPerSec: 1000
        duration: 10m
        maxSessions: 20000
        startAfter: warmup
        scenario: *scenario
