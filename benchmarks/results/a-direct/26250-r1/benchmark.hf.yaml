name: a-direct
threads: 6

http:
  host: http://backend-a:8080
  sharedConnections: 8192

phases:
  - rampup:
      increasingRate:
        initialUsersPerSec: 2625
        targetUsersPerSec: 26250
        duration: 30s
        maxSessions: 50000
        scenario: &scenario
          - read:
              - httpRequest:
                  GET: /items/1
                  handler:
                    status:
                      range: 2xx
  - hold:
      constantRate:
        usersPerSec: 26250
        duration: 90s
        maxSessions: 50000
        startAfter: rampup
        scenario: *scenario
  - steady:
      constantRate:
        usersPerSec: 26250
        duration: 3m
        maxSessions: 50000
        startAfter: hold
        scenario: *scenario
