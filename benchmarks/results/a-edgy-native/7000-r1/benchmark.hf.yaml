name: a-edgy-native
threads: 6

http:
  host: http://edgy-gateway-native:8080
  sharedConnections: 8192

phases:
- rampup:
    increasingRate:
      initialUsersPerSec: 700
      targetUsersPerSec: 7000
      duration: 30s
      maxSessions: 50000
      scenario: &scenario
      - read:
        - httpRequest:
            GET: /api/items/1
            handler:
              status:
                range: 2xx
- hold:
    constantRate:
      usersPerSec: 7000
      duration: 90s
      maxSessions: 50000
      startAfter: rampup
      scenario: *scenario
- steady:
    constantRate:
      usersPerSec: 7000
      duration: 3m
      maxSessions: 50000
      startAfter: hold
      scenario: *scenario
